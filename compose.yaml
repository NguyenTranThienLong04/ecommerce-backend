name: clothing-shop
services:
  mongo:
    image: mongo:7.0.24
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports: ["127.0.0.1:27018:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - 'try { rs.status(); } catch (e) { if (e.code === 94) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}); } quit(1); } quit(db.hello().isWritablePrimary ? 0 : 1);'
      interval: 3s
      timeout: 5s
      retries: 40
    restart: unless-stopped
  backend:
    build: .
    env_file: .env.local
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/clothing_demo?replicaSet=rs0
      FRONTEND_URL: http://localhost:3000
      VNPAY_ENABLED: "false"
      CLOUDINARY_ENABLED: "false"
    ports: ["127.0.0.1:5000:5000"]
    depends_on:
      mongo: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  frontend:
    build: ../ClothingShopProjectFE
    environment:
      NODE_ENV: development
      PORT: 3000
      BACKEND_URL: http://localhost:5000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  seed:
    build: .
    profiles: [tools]
    env_file: .env.local
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/clothing_demo?replicaSet=rs0
    command: [node, scripts/seed.js]
    depends_on:
      mongo: { condition: service_healthy }
volumes:
  mongo-data:
